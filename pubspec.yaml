name: medifind_mobile_application
description: MediFind - Emergency Response and Healthcare Management App

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0

  # Networking
  http: ^1.1.0
  dio: ^5.3.0
  web_socket_channel: ^2.4.0
  socket_io_client: ^2.0.3

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # Database
  sqflite: ^2.3.0
  sqflite_common: ^2.4.0

  # Location Services
  geolocator: ^13.0.2
  geocoding: ^3.0.0

  # Permissions
  permission_handler: ^11.4.0

  # UI & Navigation
  go_router: ^12.0.0
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0

  # Logging & Debugging
  logger: ^2.0.0

  # Encryption
  encrypt: ^5.0.0

  # JSON Serialization
  json_annotation: ^4.8.0
  freezed_annotation: ^2.4.0

  # Audio for SOS
  audio_session: ^0.1.0
  just_audio: ^0.9.0
  record: 5.0.0
  path_provider: ^2.1.0

  # Connectivity
  connectivity_plus: ^5.0.0

  # Device Info
  device_info_plus: ^10.0.0

  # Voice Alert (Text-to-Speech for responder)
  flutter_tts: ^4.0.2

  # URL Launcher (SMS/Call fallback when no internet)
  url_launcher: ^6.2.0

  # Maps (Live tracking)
  google_maps_flutter: ^2.5.0

  # File picker for medical uploads
  file_picker: ^8.0.0+1

  # Intl (date formatting)
  intl: ^0.20.2
  google_fonts: ^8.0.2
  flutter_native_splash: ^2.4.7
  image: ^4.8.0
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3

dependency_overrides:
  record_platform_interface: 1.1.0
  record_linux: 0.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Code Generation
  build_runner: ^2.4.0
  hive_generator: ^2.0.0
  json_serializable: ^6.7.0
  freezed: ^2.4.0

  # Testing
  mockito: ^5.4.0
  mocktail: ^1.0.0

  # Local DB testing ONLY — NOT for production
  postgres: ^3.5.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logos/
    - assets/icons/
    - assets/animations/
    - assets/sounds/

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/logos/Medifind_New_Logo-removebg-preview.png"
  android_12:
    image: "assets/logos/Medifind_New_Logo-removebg-preview.png"
    color: "#FFFFFF"
